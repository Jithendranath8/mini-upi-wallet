openapi: 3.0.3
info:
  title: Mini UPI Wallet API
  version: 1.0.0
  description: |
    HTTP API of the Mini UPI Wallet prototype, generated by hand from `src/api/createHttpApp.ts`,
    `src/api/controllers.ts`, `src/api/requests.ts`, `src/api/middleware.ts` and `src/readmodel/views.ts`.
    The conventions (identity, PIN, Idempotency-Key, money, envelope, headers, status codes) are explained
    in `docs/06-api-design.md`; every error code is listed in `docs/08-error-handling-and-edge-cases.md`.

    Every request under `/api` must come from the same site and a known host name (403 `CROSS_SITE_REQUEST`,
    403 `HOST_NOT_ALLOWED`). Bodies are JSON of at most 16 kB (400 or 413 `INVALID_JSON`).
servers:
  - url: http://localhost:3000
    description: Local dev server (listens on 127.0.0.1 by default)
tags:
  - name: Session
  - name: Users
  - name: Payments
  - name: Schedules
  - name: Notifications
  - name: Operator
    description: Operator and demo API. Not load balanced, not rate limited, no X-Request-Id.
  - name: Health

security: []

paths:
  /api/v1/auth/login:
    post:
      tags: [Session]
      summary: Sign in with UPI ID and PIN
      description: An unknown UPI ID and a wrong PIN both give 401 INVALID_CREDENTIALS, so sign-in does not reveal which UPI IDs exist; five wrong PINs in a row give 401 PIN_LOCKED for 60 s.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 'Session token for `Authorization: Bearer`'
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            X-Served-By: { $ref: '#/components/headers/X-Served-By' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/users:
    post:
      tags: [Users]
      summary: Register a user (user, wallet and wallet source in one unit of work)
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: The new profile
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Profile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    get:
      tags: [Users]
      summary: List all users (the demo user picker)
      operationId: listUsers
      responses:
        '200':
          description: Every user
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/UserView' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/users/resolve:
    get:
      tags: [Users]
      summary: Look up a payee by UPI ID (cached)
      operationId: resolveUpiId
      parameters:
        - name: upiId
          in: query
          required: true
          schema: { type: string, example: bob@miniupi }
      responses:
        '200':
          description: Public profile of the payee
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PartyView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/me:
    get:
      tags: [Users]
      summary: The caller's profile, wallet (cache-aside) and linked sources
      operationId: me
      security:
        - bearerAuth: []
        - userIdHeader: []
      responses:
        '200':
          description: Profile
          headers:
            X-RateLimit-Remaining: { $ref: '#/components/headers/X-RateLimit-Remaining' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Profile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/payment-sources/bank-accounts:
    post:
      tags: [Users]
      summary: Link a bank account (only the last 4 digits are kept)
      operationId: linkBankAccount
      security:
        - bearerAuth: []
        - userIdHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BankAccountRequest' }
      responses:
        '201':
          description: The linked source
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/SourceView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/payment-sources/cards:
    post:
      tags: [Users]
      summary: Link a card (Luhn check, expiry)
      operationId: linkCard
      security:
        - bearerAuth: []
        - userIdHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CardRequest' }
      responses:
        '201':
          description: The linked source
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/SourceView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/RuleViolation' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/transfers:
    post:
      tags: [Payments]
      summary: Send money to a UPI ID
      description: |
        Idempotent per (caller, Idempotency-Key). A payment that was recorded and then failed returns its
        error status with both `error` and `data.transaction` (schema `PaymentFailure`).
      operationId: transfer
      security:
        - bearerAuth: []
        - userIdHeader: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferRequest' }
      responses:
        '201': { $ref: '#/components/responses/PaymentCreated' }
        '200': { $ref: '#/components/responses/PaymentReplayed' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentFailed' }
        '403': { $ref: '#/components/responses/PaymentFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/PaymentFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/PaymentFailed' }
        '503': { $ref: '#/components/responses/PaymentFailed' }

  /api/v1/wallet/topup:
    post:
      tags: [Payments]
      summary: Load your own wallet from a linked bank account or card
      operationId: topUp
      security:
        - bearerAuth: []
        - userIdHeader: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TopUpRequest' }
      responses:
        '201': { $ref: '#/components/responses/PaymentCreated' }
        '200': { $ref: '#/components/responses/PaymentReplayed' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentFailed' }
        '403': { $ref: '#/components/responses/PaymentFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/PaymentFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/PaymentFailed' }
        '503': { $ref: '#/components/responses/PaymentFailed' }

  /api/v1/transactions:
    get:
      tags: [Payments]
      summary: Transaction history, newest first, cursor-paginated
      operationId: history
      security:
        - bearerAuth: []
        - userIdHeader: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - name: before
          in: query
          required: false
          description: The `page.nextCursor` of the previous page
          schema: { type: string }
        - $ref: '#/components/parameters/Consistency'
      responses:
        '200':
          description: One page, redacted for the caller
          headers:
            X-Data-Source: { $ref: '#/components/headers/X-Data-Source' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/X-RateLimit-Remaining' }
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TransactionView' }
                  page: { $ref: '#/components/schemas/Page' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/transactions/{id}:
    get:
      tags: [Payments]
      summary: One transaction with its state timeline and ledger entries
      operationId: transactionDetails
      security:
        - bearerAuth: []
        - userIdHeader: []
      parameters:
        - $ref: '#/components/parameters/TransactionId'
        - $ref: '#/components/parameters/Consistency'
      responses:
        '200':
          description: Details, redacted for the caller
          headers:
            X-Data-Source: { $ref: '#/components/headers/X-Data-Source' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TransactionDetails' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/transactions/{id}/refund:
    post:
      tags: [Payments]
      summary: Refund a payment (receiver for SUCCESS; either party for a FAILED payment with captured funds)
      operationId: refund
      security:
        - bearerAuth: []
        - userIdHeader: []
      parameters:
        - $ref: '#/components/parameters/TransactionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PinOnly' }
      responses:
        '200':
          description: The REFUNDED transaction, redacted for the caller
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [transaction]
                    properties:
                      transaction: { $ref: '#/components/schemas/TransactionView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RuleViolation' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/scheduled-payments:
    post:
      tags: [Schedules]
      summary: Schedule a payment (executeAt or delaySeconds)
      operationId: schedulePayment
      security:
        - bearerAuth: []
        - userIdHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleRequest' }
      responses:
        '201':
          description: The PENDING schedule
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ScheduledPaymentView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    get:
      tags: [Schedules]
      summary: The caller's 20 most recent schedules by execution time
      operationId: listScheduledPayments
      security:
        - bearerAuth: []
        - userIdHeader: []
      responses:
        '200':
          description: Schedules
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ScheduledPaymentView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/scheduled-payments/{id}:
    delete:
      tags: [Schedules]
      summary: Cancel a PENDING schedule
      operationId: cancelScheduledPayment
      security:
        - bearerAuth: []
        - userIdHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, example: sch_503fcacb38cb434f }
      responses:
        '200':
          description: The CANCELLED schedule
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ScheduledPaymentView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/notifications:
    get:
      tags: [Notifications]
      summary: Delivered and failed notifications for the caller
      operationId: notifications
      security:
        - bearerAuth: []
        - userIdHeader: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Positive integer, default 15, clamped to 50
          schema: { type: integer, minimum: 1 }
        - $ref: '#/components/parameters/Consistency'
      responses:
        '200':
          description: Notifications, newest first
          headers:
            X-Data-Source: { $ref: '#/components/headers/X-Data-Source' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/NotificationView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /health:
    get:
      tags: [Health]
      summary: Liveness
      operationId: health
      responses:
        '200':
          description: Alive
          content:
            application/json:
              schema:
                type: object
                required: [status, uptimeSeconds]
                properties:
                  status: { type: string, enum: [ok] }
                  uptimeSeconds: { type: integer }

  /api/v1/system/metrics:
    get:
      tags: [Operator]
      summary: One snapshot of every component's counters
      operationId: metrics
      responses:
        '200':
          description: Free-form snapshot (`SystemService.snapshot`)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties: true
                    properties:
                      deadLetters: { type: integer }
                      stuckCompensations: { type: integer }

  /api/v1/system/design:
    get:
      tags: [Operator]
      summary: What is plugged into each extension point
      operationId: design
      responses:
        '200':
          description: Names of the chain links, fraud rules, strategies and observers
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Design' }

  /api/v1/system/feed:
    get:
      tags: [Operator]
      summary: Latest trace steps across all requests
      operationId: feed
      parameters:
        - name: limit
          in: query
          required: false
          description: Positive integer, default 60, clamped to 250
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/FeedItem' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/system/traces/{id}:
    get:
      tags: [Operator]
      summary: Every step of one request, by X-Request-Id
      operationId: trace
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, example: req_d3f69879335d4bb8 }
      responses:
        '200':
          description: The trace
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Trace' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/system/ledger:
    get:
      tags: [Operator]
      summary: Most recent ledger entries
      operationId: recentLedger
      parameters:
        - name: limit
          in: query
          required: false
          description: Positive integer, default 30, clamped to 200
          schema: { type: integer, minimum: 1 }
        - $ref: '#/components/parameters/Consistency'
      responses:
        '200':
          description: Newest first
          headers:
            X-Data-Source: { $ref: '#/components/headers/X-Data-Source' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/LedgerEntryView' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/system/ledger/verify:
    get:
      tags: [Operator]
      summary: Full ledger audit on the primary
      operationId: verifyLedger
      responses:
        '200':
          description: Hash chain, double entry and wallet totals
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/LedgerVerification' }

  /api/v1/system/docs:
    get:
      tags: [Operator]
      summary: The design documents and their titles
      operationId: designDocs
      responses:
        '200':
          description: One entry per `docs/*.md`
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [file, title]
                      properties:
                        file: { type: string, example: 06-api-design.md }
                        title: { type: string }

  /api/v1/system/ledger/tamper-test:
    post:
      tags: [Operator]
      summary: Try UPDATE, DELETE and INSERT OR REPLACE on the newest ledger row
      operationId: tamperTest
      security:
        - operatorKey: []
        - {}
      responses:
        '200':
          description: What the database said to each attempt
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [update, delete, replace]
                    properties:
                      update: { $ref: '#/components/schemas/TamperResult' }
                      delete: { $ref: '#/components/schemas/TamperResult' }
                      replace: { $ref: '#/components/schemas/TamperResult' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/system/chaos:
    put:
      tags: [Operator]
      summary: Change fault-injection settings
      operationId: updateChaos
      security:
        - operatorKey: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChaosPatch' }
      responses:
        '200':
          description: The new settings
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ChaosState' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/system/nodes/{id}:
    put:
      tags: [Operator]
      summary: Mark an app node healthy or unhealthy
      operationId: setNodeHealth
      security:
        - operatorKey: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, example: app-node-2 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [healthy]
              properties:
                healthy: { type: boolean }
      responses:
        '200':
          description: The node
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, healthy, served]
                    properties:
                      id: { type: string }
                      healthy: { type: boolean }
                      served: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/system/queue/redrive:
    post:
      tags: [Operator]
      summary: Re-queue dead-lettered notifications and stuck compensations
      operationId: redrive
      security:
        - operatorKey: []
        - {}
      responses:
        '200':
          description: How many messages were re-queued
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [redriven]
                    properties:
                      redriven: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/system/breakers/reset:
    post:
      tags: [Operator]
      summary: Force both circuit breakers to CLOSED
      operationId: resetBreakers
      security:
        - operatorKey: []
        - {}
      responses:
        '200': { $ref: '#/components/responses/ResetDone' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/system/reset:
    post:
      tags: [Operator]
      summary: Wipe all data and seed the demo data again
      operationId: resetDemo
      security:
        - operatorKey: []
        - {}
      responses:
        '200': { $ref: '#/components/responses/ResetDone' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: '<userId>.<expiryMillis>.<HMAC-SHA256 signature>'
      description: Token from POST /api/v1/auth/login, valid for 30 minutes. Always wins over X-User-Id.
    userIdHeader:
      type: apiKey
      in: header
      name: X-User-Id
      description: Demo convenience, honoured only while the setting allowHeaderIdentity is true (the default).
    operatorKey:
      type: apiKey
      in: header
      name: X-Operator-Key
      description: Required on non-GET operator routes only when the setting operatorKey (env OPERATOR_KEY) is non-empty.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Same value on every retry of one payment. Must not start with "scheduled:".
      schema: { type: string, minLength: 8, maxLength: 128, example: dffbb5a5-0905-4971-b1a3-e88c216faa68 }
    Limit:
      name: limit
      in: query
      required: false
      description: Positive integer, default 20, clamped to 100
      schema: { type: integer, minimum: 1 }
    Consistency:
      name: consistency
      in: query
      required: false
      description: '"strong" reads from the primary instead of the replica'
      schema: { type: string, enum: [strong] }
    TransactionId:
      name: id
      in: path
      required: true
      schema: { type: string, example: txn_cabdc879a38d42dd }

  headers:
    X-Request-Id:
      description: Request id, also in error.requestId; trace at /api/v1/system/traces/{id}
      schema: { type: string, example: req_d3f69879335d4bb8 }
    X-Served-By:
      description: Logical app node chosen by round robin
      schema: { type: string, example: app-node-3 }
    X-RateLimit-Remaining:
      description: Whole tokens left in the caller's bucket (authenticated routes only)
      schema: { type: integer }
    Retry-After:
      description: Seconds until a token is available (429 only)
      schema: { type: integer }
    Idempotent-Replayed:
      description: true when this is the stored answer of an earlier request
      schema: { type: string, enum: ['true', 'false'] }
    X-Data-Source:
      description: Which database answered
      schema: { type: string, enum: [primary, replica] }

  responses:
    PaymentCreated:
      description: New payment completed (SUCCESS)
      headers:
        Idempotent-Replayed: { $ref: '#/components/headers/Idempotent-Replayed' }
        X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
        X-RateLimit-Remaining: { $ref: '#/components/headers/X-RateLimit-Remaining' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PaymentSuccess' }
    PaymentReplayed:
      description: Stored success of an earlier request with the same key
      headers:
        Idempotent-Replayed: { $ref: '#/components/headers/Idempotent-Replayed' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PaymentSuccess' }
    PaymentFailed:
      description: A recorded payment that failed (error plus data.transaction), or an error raised before anything was recorded
      headers:
        Idempotent-Replayed: { $ref: '#/components/headers/Idempotent-Replayed' }
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/PaymentFailure'
              - $ref: '#/components/schemas/ErrorResponse'
    ResetDone:
      description: Done
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [reset]
                properties:
                  reset: { type: boolean, enum: [true] }
    BadRequest:
      description: Malformed input (INVALID_INPUT, or INVALID_JSON from the body parser; 413 for a body over 16 kB)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: UNAUTHENTICATED, INVALID_TOKEN, TOKEN_EXPIRED, INVALID_CREDENTIALS, INVALID_PIN, PIN_LOCKED
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: ACCOUNT_BLOCKED, REFUND_NOT_ALLOWED, CROSS_SITE_REQUEST, HOST_NOT_ALLOWED, OPERATOR_KEY_REQUIRED, ...
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Not found, or exists but is not the caller's
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Conflicts with the current state (ILLEGAL_STATE_TRANSITION, REQUEST_IN_PROGRESS, UPI_ID_TAKEN, ...)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RuleViolation:
      description: Well-formed but breaks a business rule
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    TooManyRequests:
      description: RATE_LIMIT_EXCEEDED
      headers:
        Retry-After: { $ref: '#/components/headers/Retry-After' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ServiceUnavailable:
      description: A dependency is temporarily unavailable (GATEWAY_UNAVAILABLE, CIRCUIT_OPEN, LOCK_TIMEOUT, NO_HEALTHY_NODES)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: FRAUD_SUSPECTED }
        message: { type: string }
        details:
          type: object
          additionalProperties: true
        requestId:
          type: string
          description: Absent when the request was rejected before a request id was assigned
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/ErrorBody' }
    PaymentSuccess:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [transaction]
          properties:
            transaction: { $ref: '#/components/schemas/TransactionView' }
    PaymentFailure:
      type: object
      required: [error, data]
      properties:
        error: { $ref: '#/components/schemas/ErrorBody' }
        data:
          type: object
          required: [transaction]
          properties:
            transaction: { $ref: '#/components/schemas/TransactionView' }

    LoginRequest:
      type: object
      required: [upiId, pin]
      properties:
        upiId: { type: string, maxLength: 60, example: alice@miniupi }
        pin: { type: string, example: '1234' }
    RegisterRequest:
      type: object
      required: [name, phone, pin]
      properties:
        name: { type: string, minLength: 2, maxLength: 50, description: 'No control characters or < >' }
        phone: { type: string, pattern: '^[6-9][0-9]{9}$' }
        pin: { type: string, pattern: '^[0-9]{4,6}$' }
        email: { type: string, maxLength: 120 }
        upiHandle: { type: string, pattern: '^[a-z0-9._-]{3,30}$', description: Defaults to the name, lower-cased }
        dailyLimit: { type: number, description: 'Rupees, above 0 and at most 100000; default 50000' }
    BankAccountRequest:
      type: object
      required: [bankName, accountNumber, ifsc]
      properties:
        bankName: { type: string, minLength: 2, maxLength: 40 }
        accountNumber: { type: string, pattern: '^[0-9]{9,18}$' }
        ifsc: { type: string, maxLength: 11, description: 'Upper-cased, then must match ^[A-Z]{4}0[A-Z0-9]{6}$' }
    CardRequest:
      type: object
      required: [network, cardNumber, expiryMonth, expiryYear]
      properties:
        network: { type: string, enum: [Visa, Mastercard, RuPay] }
        cardNumber: { type: string, pattern: '^[0-9]{13,19}$', description: Must pass the Luhn check }
        expiryMonth: { type: integer, minimum: 1, maximum: 12 }
        expiryYear: { type: integer, minimum: 2000, maximum: 2100 }
    TransferRequest:
      type: object
      required: [receiverUpiId, pin]
      description: Send `amountPaise` (preferred) or `amount`; when both are present `amountPaise` is used.
      properties:
        receiverUpiId: { type: string, maxLength: 60, example: bob@miniupi }
        amountPaise: { type: integer, minimum: 1, maximum: 100000000, example: 200 }
        amount: { type: number, exclusiveMinimum: true, minimum: 0, maximum: 1000000, description: 'Rupees, at most 2 decimals' }
        sourceId: { type: string, maxLength: 40, description: Defaults to the caller's wallet }
        note: { type: string, maxLength: 80 }
        pin: { type: string }
    TopUpRequest:
      type: object
      required: [sourceId, pin]
      description: Send `amountPaise` (preferred) or `amount`.
      properties:
        amountPaise: { type: integer, minimum: 1, maximum: 100000000 }
        amount: { type: number, exclusiveMinimum: true, minimum: 0, maximum: 1000000 }
        sourceId: { type: string, maxLength: 40, description: A linked bank account or card }
        pin: { type: string }
    PinOnly:
      type: object
      required: [pin]
      properties:
        pin: { type: string }
    ScheduleRequest:
      type: object
      required: [receiverUpiId, pin]
      description: Send `executeAt` or `delaySeconds` (at most 30 days ahead), and `amountPaise` or `amount`.
      properties:
        receiverUpiId: { type: string, maxLength: 60 }
        amountPaise: { type: integer, minimum: 1, maximum: 100000000 }
        amount: { type: number, exclusiveMinimum: true, minimum: 0, maximum: 1000000 }
        sourceId: { type: string, maxLength: 40 }
        note: { type: string, maxLength: 80 }
        executeAt: { type: string, maxLength: 40, format: date-time }
        delaySeconds: { type: number }
        pin: { type: string }

    Session:
      type: object
      required: [token, expiresAt, user]
      properties:
        token: { type: string }
        expiresAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/UserView' }
    PartyView:
      type: object
      required: [id, name, upiId]
      properties:
        id: { type: string, example: usr_91cf53b46aa24b72 }
        name: { type: string }
        upiId: { type: string }
    UserView:
      allOf:
        - $ref: '#/components/schemas/PartyView'
        - type: object
          required: [phone, email, status, dailyLimit, notificationChannels, blacklisted]
          properties:
            phone: { type: string }
            email: { type: string, nullable: true }
            status: { type: string, enum: [ACTIVE, BLOCKED] }
            dailyLimit: { type: number, description: Rupees }
            notificationChannels:
              type: array
              items: { type: string, enum: [SMS, PUSH, EMAIL] }
            blacklisted: { type: boolean }
    WalletView:
      type: object
      required: [id, userId, balance, balancePaise, status, version, updatedAt]
      properties:
        id: { type: string }
        userId: { type: string }
        balance: { type: number, description: Rupees }
        balancePaise: { type: integer }
        status: { type: string, enum: [ACTIVE, FROZEN] }
        version: { type: integer }
        updatedAt: { type: string, format: date-time }
    SourceView:
      type: object
      required: [id, type, label, isExternal, perTransactionLimit]
      properties:
        id: { type: string }
        type: { type: string, enum: [WALLET, BANK_ACCOUNT, CARD] }
        label: { type: string, example: HDFC Bank XXXX6789 }
        isExternal: { type: boolean }
        perTransactionLimit: { type: number, description: Rupees }
    Profile:
      type: object
      required: [user, wallet, sources]
      properties:
        user: { $ref: '#/components/schemas/UserView' }
        wallet: { $ref: '#/components/schemas/WalletView' }
        sources:
          type: array
          items: { $ref: '#/components/schemas/SourceView' }
    TransactionView:
      type: object
      required: [id, type, status, amount, amountPaise, sender, receiver, source, note, failureCode, failureReason, createdAt, updatedAt]
      properties:
        id: { type: string, example: txn_cabdc879a38d42dd }
        type: { type: string, enum: [P2P, TOPUP] }
        status: { type: string, enum: [INITIATED, PROCESSING, SUCCESS, FAILED, REFUNDED] }
        amount: { type: number, description: Rupees }
        amountPaise: { type: integer }
        sender: { $ref: '#/components/schemas/PartyView' }
        receiver: { $ref: '#/components/schemas/PartyView' }
        source:
          type: object
          description: For anyone but the payer, id is empty and label is generic (Wallet, Bank account, Card)
          required: [id, type, label]
          properties:
            id: { type: string }
            type: { type: string, enum: [WALLET, BANK_ACCOUNT, CARD] }
            label: { type: string }
        note: { type: string }
        failureCode: { type: string, nullable: true }
        failureReason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Page:
      type: object
      required: [nextCursor]
      properties:
        nextCursor:
          type: string
          nullable: true
          description: Pass back as ?before= for the next, older page; null on the last page
    TimelineEntry:
      type: object
      required: [from, to, detail, at]
      properties:
        from: { type: string, nullable: true }
        to: { type: string }
        detail: { type: string }
        at: { type: string, format: date-time }
    LedgerEntryView:
      type: object
      required: [sequence, id, transactionId, accountId, entryType, amount, balanceAfter, description, prevHash, hash, createdAt]
      properties:
        sequence: { type: integer, nullable: true }
        id: { type: string }
        transactionId: { type: string }
        accountId: { type: string, example: 'WALLET:wal_2b8e01ffda124174' }
        entryType: { type: string, enum: [DEBIT, CREDIT] }
        amount: { type: number, description: Rupees }
        balanceAfter: { type: number, nullable: true }
        description: '{ type: string }'
        prevHash: { type: string }
        hash: { type: string }
        createdAt: { type: string, format: date-time }
    TransactionDetails:
      type: object
      required: [transaction, timeline, ledger]
      properties:
        transaction: { $ref: '#/components/schemas/TransactionView' }
        timeline:
          type: array
          items: { $ref: '#/components/schemas/TimelineEntry' }
        ledger:
          type: array
          description: The other party's lines are redacted
          items: { $ref: '#/components/schemas/LedgerEntryView' }
    NotificationView:
      type: object
      required: [id, transactionId, channel, title, body, status, attempts, createdAt]
      properties:
        id: { type: string }
        transactionId: { type: string }
        channel: { type: string, enum: [SMS, PUSH, EMAIL] }
        title: { type: string }
        body: { type: string }
        status: { type: string, enum: [SENT, FAILED] }
        attempts: { type: integer }
        createdAt: { type: string, format: date-time }
    ScheduledPaymentView:
      type: object
      required: [id, receiverUpiId, amount, note, executeAt, status, transactionId, failureReason]
      properties:
        id: { type: string }
        receiverUpiId: { type: string }
        amount: { type: number, description: Rupees }
        note: { type: string }
        executeAt: { type: string, format: date-time }
        status: { type: string, enum: [PENDING, RUNNING, EXECUTED, FAILED, CANCELLED] }
        transactionId: { type: string, nullable: true }
        failureReason: { type: string, nullable: true }

    Design:
      type: object
      required: [validationChain, fraudRules, paymentStrategies, observers]
      properties:
        validationChain: { type: array, items: { type: string } }
        fraudRules: { type: array, items: { type: string } }
        paymentStrategies: { type: array, items: { type: string } }
        observers: { type: array, items: { type: string } }
    TraceStep:
      type: object
      required: [atMs, component, message, level]
      properties:
        atMs: { type: integer, description: Milliseconds since the trace started }
        component: { type: string }
        message: { type: string }
        level: { type: string, enum: [info, ok, warn, error] }
    FeedItem:
      allOf:
        - $ref: '#/components/schemas/TraceStep'
        - type: object
          required: [timestamp, traceId]
          properties:
            timestamp: { type: string, format: date-time }
            traceId: { type: string, nullable: true }
    Trace:
      type: object
      required: [id, label, startedAt, steps]
      properties:
        id: { type: string }
        label: { type: string, example: POST /api/v1/transfers }
        startedAt: { type: string, format: date-time }
        steps:
          type: array
          items: { $ref: '#/components/schemas/TraceStep' }
    LedgerVerification:
      type: object
      required: [healthy, entries, chainIntact, brokenAtSequence, unbalancedTransactions, walletMismatches]
      properties:
        healthy: { type: boolean }
        entries: { type: integer }
        chainIntact: { type: boolean }
        brokenAtSequence: { type: integer, nullable: true }
        unbalancedTransactions: { type: array, items: { type: string } }
        walletMismatches:
          type: array
          items:
            type: object
            required: [walletId, ledgerPaise, balancePaise]
            properties:
              walletId: { type: string }
              ledgerPaise: { type: integer }
              balancePaise: { type: integer }
    TamperResult:
      type: object
      required: [blocked, databaseSaid]
      properties:
        blocked: { type: boolean }
        databaseSaid: { type: string }
    GatewayFaults:
      type: object
      required: [latencyMs, failureRate, down]
      properties:
        latencyMs: { type: number, minimum: 0, maximum: 60000 }
        failureRate: { type: number, minimum: 0, maximum: 1 }
        down: { type: boolean }
    ChaosState:
      type: object
      required: [bank, card, replicaLagMs, databaseLatencyMs, notificationFailureRate, failNextCredit]
      properties:
        bank: { $ref: '#/components/schemas/GatewayFaults' }
        card: { $ref: '#/components/schemas/GatewayFaults' }
        replicaLagMs: { type: number, minimum: 0, maximum: 60000 }
        databaseLatencyMs: { type: number, minimum: 0, maximum: 60000 }
        notificationFailureRate: { type: number, minimum: 0, maximum: 1 }
        failNextCredit: { type: boolean, description: 'The next balance-increasing wallet save fails once' }
    ChaosPatch:
      type: object
      description: Any subset of ChaosState; unknown fields are ignored
      properties:
        bank:
          type: object
          properties:
            latencyMs: { type: number }
            failureRate: { type: number }
            down: { type: boolean }
        card:
          type: object
          properties:
            latencyMs: { type: number }
            failureRate: { type: number }
            down: { type: boolean }
        replicaLagMs: { type: number }
        databaseLatencyMs: { type: number }
        notificationFailureRate: { type: number }
        failNextCredit: { type: boolean }
